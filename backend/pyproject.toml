[project]
name = "relay"
version = "1.0.0"
description = "Uptime monitoring with incident detection, alerts and a public status page"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["relay"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "pgserver>=0.1", "trustme>=1.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
